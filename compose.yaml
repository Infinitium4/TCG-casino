services:
  casino:
    build: .
    container_name: tcg-casino
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5500"
      DATA_DIR: /data
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      SECOND_ADMIN_USERNAME: "${SECOND_ADMIN_USERNAME:-admin2}"
      SECOND_ADMIN_PASSWORD: "${SECOND_ADMIN_PASSWORD:?Set SECOND_ADMIN_PASSWORD in .env}"
      BANK_USERNAME: "${BANK_USERNAME:-casino-bank}"
      CRASH_ENABLED: "${CRASH_ENABLED:-true}"
      TOWER_MULTIPLIERS: "${TOWER_MULTIPLIERS:-[1.08,1.22,1.40,1.64,1.95,2.35,2.90,3.65]}"
      REGISTRATION_RATE_WINDOW_MS: "${REGISTRATION_RATE_WINDOW_MS:-900000}"
      REGISTRATION_RATE_LIMIT: "${REGISTRATION_RATE_LIMIT:-30}"
      REGISTRATION_CAPTCHA_RATE_LIMIT: "${REGISTRATION_CAPTCHA_RATE_LIMIT:-60}"
    ports:
      - "5500:5500"
    volumes:
      - casino-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  casino-data:
