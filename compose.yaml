services:
  casino:
    build: .
    container_name: tcg-casino
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5500"
      DATA_DIR: /data
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
    ports:
      - "5500:5500"
    volumes:
      - casino-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  casino-data:
