<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNDERGROUND — Blackjack</title>
    <link rel="icon" type="image/svg+xml" href="/underground-mark.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/bunker.css" />
  </head>
  <body>
    <div class="page-noise"></div>
    <div class="app-shell blackjack-game-shell">
      <header class="blackjack-game-header panel">
        <a class="brand-block brand-home-link" href="/" aria-label="Accueil Underground">
          <div class="brand-mark"><img src="/underground-mark.svg" alt="" /></div>
          <div class="brand-copy">
            <div class="brand-name">UNDERGROUND</div>
            <div class="brand-tag">BLACKJACK TABLE</div>
          </div>
        </a>
        <button id="goLobbyBtn" class="secondary-button" type="button">Retour au casino</button>
      </header>

      <main class="blackjack-game-main">
        <section class="blackjack-table-felt" aria-label="Table de blackjack">
          <div class="blackjack-table-mark" aria-hidden="true">21</div>
          <div id="tableBanner" class="blackjack-table-banner">Chargement de la table...</div>
          <div class="blackjack-dealer-area">
            <div id="dealerStatus" class="blackjack-role-label">Croupier</div>
            <div id="dealerCards" class="board-cards" aria-label="Main du croupier"></div>
            <strong id="dealerTotal" class="blackjack-total">Score : ?</strong>
          </div>
          <div id="blackjackTableSeats" class="blackjack-seat-row" aria-label="Mains des joueurs"></div>
        </section>

        <section class="blackjack-table-footer">
          <div class="blackjack-action-panel panel">
            <div id="turnInfo" class="blackjack-turn-info" aria-live="polite">Chargement...</div>
            <div id="actionControls" class="blackjack-action-controls"></div>
          </div>
          <details class="blackjack-history panel">
            <summary>Historique de la manche</summary>
            <div id="historyLog" class="history-list compact"></div>
          </details>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/money.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/screen-time.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/blackjack-game.js"></script>
  </body>
</html>
