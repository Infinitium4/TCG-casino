name: Deploy UNDERGROUND

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier le projet
        run: |
          test -f Dockerfile
          test -f compose.yaml
          test -f server.js

      - name: Deployer sur la VM
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="/home/cgn/TCG-casino"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-*' \
            --exclude='actions-runner/' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

          cd "$APP_DIR"

          docker compose up -d --build

      - name: Verifier que le site repond
        shell: bash
        run: |
          set -uo pipefail

          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://127.0.0.1:5500/ >/dev/null; then
              echo "Application accessible !"
              exit 0
            fi

            echo "Application en cours de demarrage ($i/15)..."
            sleep 2
          done

          echo "Echec : l'application ne repond pas apres 30 secondes."
          docker logs --tail 100 tcg-casino
          exit 1
